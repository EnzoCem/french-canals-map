<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="French Canals Map">
  <!-- Dark nautical background -->
  <rect width="512" height="512" fill="#0a1a2a"/>
  <!-- Water -->
  <path d="M0 330 Q128 300 256 330 T512 330 L512 512 L0 512 Z" fill="#1a4a7a"/>
  <path d="M0 360 Q128 335 256 360 T512 360 L512 512 L0 512 Z" fill="#2563a0" opacity="0.6"/>
  <!-- Canal banks / tricolor hint -->
  <rect x="0" y="310" width="170" height="20" fill="#0055a4" opacity="0.5"/>
  <rect x="171" y="310" width="170" height="20" fill="#ffffff" opacity="0.25"/>
  <rect x="342" y="310" width="170" height="20" fill="#ef4135" opacity="0.5"/>
  <!-- Boat hull -->
  <path d="M120 290 L392 290 L360 350 L152 350 Z" fill="#e8c878" stroke="#8a6a2a" stroke-width="3"/>
  <!-- Boat cabin -->
  <rect x="180" y="230" width="160" height="62" rx="6" fill="#d95b5b" stroke="#6a2a2a" stroke-width="3"/>
  <!-- Windows -->
  <rect x="198" y="248" width="30" height="28" rx="3" fill="#7ad4ef"/>
  <rect x="241" y="248" width="30" height="28" rx="3" fill="#7ad4ef"/>
  <rect x="284" y="248" width="30" height="28" rx="3" fill="#7ad4ef"/>
  <!-- Smokestack -->
  <rect x="340" y="180" width="18" height="50" fill="#333"/>
  <rect x="336" y="175" width="26" height="10" fill="#555"/>
  <!-- Flag -->
  <line x1="140" y1="200" x2="140" y2="240" stroke="#333" stroke-width="3"/>
  <rect x="140" y="200" width="40" height="24" fill="#0055a4"/>
  <rect x="153" y="200" width="14" height="24" fill="#ffffff"/>
  <rect x="167" y="200" width="13" height="24" fill="#ef4135"/>
  <!-- Lock chamber hint (small on right) -->
  <rect x="420" y="380" width="70" height="30" fill="none" stroke="#5bc0de" stroke-width="3"/>
</svg>
